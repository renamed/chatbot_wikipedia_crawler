name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_PAT }}
          persist-credentials: true

      - name: Install GitHub CLI
        run: |
          which gh || sudo apt-get install -y gh

      - name: Extract and Validate Version
        id: changelog-env
        uses: ./.github/actions/get-and-validate-version

      - name: Sync pyproject version from CHANGELOG
        id: sync-version
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          VERSION_TAG="${{ steps.changelog-env.outputs.version_tag }}"
          VERSION="${VERSION_TAG#v}"

          python - <<PY
          import re
          from pathlib import Path

          version = """${VERSION}"""
          path = Path("pyproject.toml")
          text = path.read_text()
          new_text, count = re.subn(r'^(version\s*=\s*)".*"$', rf'\1"{version}"', text, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit("pyproject.toml version field not found or ambiguous")
          if new_text != text:
              path.write_text(new_text)
              print(f"Updated pyproject.toml version to {version}")
          else:
              print(f"pyproject.toml version already matches {version}")
          PY

      - name: Check for pyproject changes
        id: has-diff
        shell: bash
        run: |
          if git diff --quiet -- pyproject.toml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request for version sync
        id: create-pr
        if: steps.has-diff.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          VERSION_TAG="${{ steps.changelog-env.outputs.version_tag }}"
          VERSION="${VERSION_TAG#v}"
          BRANCH="release-sync-${VERSION}"

          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: sync pyproject version to ${VERSION} [skip ci]"
          git push --set-upstream origin "$BRANCH"

          PR_NUMBER=$(gh pr create \
            --title "chore: sync pyproject version to ${VERSION_TAG}" \
            --body "Automatically sync pyproject.toml version with CHANGELOG.md." \
            --base main \
            --head "$BRANCH" \
            --repo ${{ github.repository }} \
            --json number \
            -q .number)

          echo "pull_request_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Dispatch Validate PR Changelog
        if: steps.has-diff.outputs.changed == 'true' && steps.create-pr.outputs.pull-request-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          gh workflow run check-changlog-changed.yml \
            --ref main \
            -f pr_number=${{ steps.create-pr.outputs.pull-request-number }} \
            --repo ${{ github.repository }}

      - name: Enable automerge on PR
        if: steps.has-diff.outputs.changed == 'true' && steps.create-pr.outputs.pull-request-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} \
            --auto \
            --squash \
            --repo ${{ github.repository }}

      - name: Create Git Tag
        shell: bash
        run: |
          git tag ${{ steps.changelog-env.outputs.version_tag }}
          git push origin ${{ steps.changelog-env.outputs.version_tag }}

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          gh release create ${{ steps.changelog-env.outputs.version_tag }} \
            --title "${{ steps.changelog-env.outputs.version_tag }}" \
            --notes "${{ steps.changelog-env.outputs.changelog_body }}" \
            ${{ steps.changelog-env.outputs.is_prerelease == 'true' && '--prerelease' || '' }} \
            --repo ${{ github.repository }}

      - name: Dispatch Validate PR Changelog
        if: steps.has-diff.outputs.changed == 'true' && steps.create-pr.outputs.pull-request-number != ''
        shell: basha
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          gh workflow run check-changlog-changed.yml \
            --ref "release-sync-${{ steps.changelog-env.outputs.version_tag }}" \
            --repo ${{ github.repository }}