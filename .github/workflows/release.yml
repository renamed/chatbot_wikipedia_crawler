name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_PAT || github.token }}
          persist-credentials: true

      - name: Extract and Validate Version
        id: changelog-env
        uses: ./.github/actions/get-and-validate-version

      - name: Sync pyproject version from CHANGELOG
        id: sync-version
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          VERSION_TAG="${{ steps.changelog-env.outputs.version_tag }}"
          VERSION="${VERSION_TAG#v}"

          python - <<'PY'
          import re
          from pathlib import Path

          version = """${VERSION}"""
          path = Path(r"${{ github.workspace }}") / "pyproject.toml"
          text = path.read_text()
          new_text, count = re.subn(r'^(version\s*=\s*)".*"$', rf'\1"{version}"', text, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit("pyproject.toml version field not found or ambiguous")
          if new_text != text:
              path.write_text(new_text)
              print(f"Updated pyproject.toml version to {version}")
          else:
              print(f"pyproject.toml version already matches {version}")
          PY

      - name: Check for pyproject changes
        id: has-diff
        shell: bash
        run: |
          if git diff --quiet -- pyproject.toml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request for version sync
        id: create-pr
        if: steps.has-diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.AUTOMATION_PAT || github.token }}
          commit-message: "chore: sync pyproject version to ${{ steps.changelog-env.outputs.version_tag }} [skip ci]"
          title: "chore: sync pyproject version to ${{ steps.changelog-env.outputs.version_tag }}"
          body: "Automatically sync pyproject.toml version with CHANGELOG.md."
          branch: "release-sync-${{ steps.changelog-env.outputs.version_tag }}"
          base: main
          delete-branch: true
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

      - name: Enable automerge on PR
        if: steps.has-diff.outputs.changed == 'true' && steps.create-pr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v2
        with:
          token: ${{ secrets.AUTOMATION_PAT || github.token }}
          pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
          merge-method: squash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog-env.outputs.version_tag }}
          name: ${{ steps.changelog-env.outputs.pr_title }}
          body: ${{ steps.changelog-env.outputs.changelog_body }}
          prerelease: ${{ steps.changelog-env.outputs.is_prerelease == 'true' }}