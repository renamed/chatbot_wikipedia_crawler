name: Validate PR Changelog

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if CHANGELOG.md was modified
        run: |
          git fetch origin ${{ github.base_ref }}
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | tr '\n' ' ')
          
          if [[ ! " $FILES " =~ " CHANGELOG.md " ]]; then
            echo "Error: CHANGELOG.md has not been modified in this PR."
            exit 1
          fi

      - name: Extract and Validate Version
        uses: ./.github/actions/get-and-validate-version