name: Get and Validate Changelog Version
description: Extracts version and exact release notes from CHANGELOG.md, and checks for prerelease status.

inputs:
  pr_title:
    description: "Pull request title to use as release title"
    required: true

outputs:
  version_tag:
    description: "The extracted version tag (e.g., v0.1.0-prerelease.1)"
    value: ${{ steps.extract-version.outputs.version_tag }}
  is_prerelease:
    description: "True if the version is a prerelease"
    value: ${{ steps.extract-version.outputs.is_prerelease }}
  changelog_body:
    description: "The release notes extracted from CHANGELOG.md"
    value: ${{ steps.extract-version.outputs.changelog_body }}
  pr_title:
    description: "The title of the PR"
    value: ${{ steps.pr-metadata.outputs.pr_title }}

runs:
  using: "composite"
  steps:
    - name: Extract and Validate Changelog Data
      id: extract-version
      shell: bash
      run: |
        FULL_HEADER=$(grep -m 1 '^## ' CHANGELOG.md | sed 's/^## //')
        
        if [ -z "$FULL_HEADER" ]; then
          echo "Error: No version header (##) found in CHANGELOG.md."
          exit 1
        fi
        
        if [[ ! "$FULL_HEADER" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ ! "$FULL_HEADER" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-prerelease\.[0-9]+$ ]]; then
          echo "Error: Version '$FULL_HEADER' does not match the required format."
          echo "Expected 'vX.Y.Z' or 'vX.Y.Z-prerelease.N'"
          exit 1
        fi
        
        echo "version_tag=$FULL_HEADER" >> $GITHUB_OUTPUT
        echo "Valid version format detected: $FULL_HEADER"
        
        if [[ "$FULL_HEADER" == *"-prerelease"* ]]; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
          echo "This is flagged as a Prerelease."
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
          echo "This is flagged as a Full Production Release."
        fi
        
        BODY=$(awk '/^## /{if (p) exit; p=1; next} p' CHANGELOG.md)
        
        echo "changelog_body<<EOF" >> $GITHUB_OUTPUT
        echo "$BODY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Verify tag uniqueness on GitHub
      shell: bash
      run: |
        TAG="${{ steps.extract-version.outputs.version_tag }}"
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Error: The release/tag $TAG already exists on GitHub."
          exit 1
        else
          echo "Success: $TAG is available and unique."
        fi

    - name: Process PR Metadata Input
      id: pr-metadata
      shell: bash
      run: |
        echo "pr_title=${{ inputs.pr_title }}" >> $GITHUB_OUTPUT